name: Sync v2fly geosite rules

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Shallow clone v2fly/domain-list-community
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git upstream
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup Go matching upstream go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod

      - name: Export plaintext lists using official v2fly generator
        run: |
          LISTS=$(grep -vE '^\s*(#|$)' lists.txt | paste -sd, -)
          echo "Exporting lists: $LISTS"
          mkdir -p exported
          (cd upstream && go run . --datapath=./data --exportlists="$LISTS" --outputdir=../exported)

      - name: Convert to Surge / Mihomo / QX compatible RULE-SET
        run: python3 scripts/convert.py

      - name: Commit and push if rules changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi
          git commit -m "chore(rules): sync v2fly/domain-list-community@${UPSTREAM_SHA}"
          git push
